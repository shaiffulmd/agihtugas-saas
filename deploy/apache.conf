# Apache 2.4 + PHP-FPM; rendered by install-vps.sh.
# Enable proxy, proxy_fcgi, rewrite, authz_core and dir modules.
# HTTP bootstrap only: configure TLS before using account setup.
<VirtualHost *:80>
    ServerName __DOMAIN__
    DocumentRoot "__WEBROOT__"
    DirectoryIndex index.php
    ProxyRequests Off
    LimitRequestBody 3145728

    <Directory "__WEBROOT__">
        Options -Indexes -MultiViews +FollowSymLinks
        AllowOverride None
        Require all granted
        RewriteEngine On
        RewriteRule (^|/)\. - [F,END]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [END]

        <FilesMatch "(?i)^(?!index\.php$).*\.php$">
            Require all denied
        </FilesMatch>
        <Files "index.php">
            SetHandler "proxy:unix:__SOCKET__|fcgi://localhost/"
            Require all granted
        </Files>
        <FilesMatch "(?i)\.(sqlite|sqlite3|db|log|env|bak|zip|tar|gz)$">
            Require all denied
        </FilesMatch>
    </Directory>
</VirtualHost>
